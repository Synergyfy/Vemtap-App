<script>
  (function() {

    const timerElem = document.getElementById('resend-timer');

      const countdown = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          timerElem.textContent = `(0:${timeLeft < 10 ? '0' + timeLeft : timeLeft})`;

      }, 1000);
