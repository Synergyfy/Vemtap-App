<script>
  (function() {
    const toggleBtn = document.getElementById('toggle-password');
    const input = document.getElementById('security-credential');
    const icon = document.getElementById('password-eye-icon');
    
    if (toggleBtn && input && icon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        icon.textContent = isPassword ? 'visibility' : 'visibility_off';
        if (isPassword) {
          input.classList.remove('tracking-widest');
        } else {
          input.classList.add('tracking-widest');
        }
      });
    }
  })();
