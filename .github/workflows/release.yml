name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  android:
    name: Android beta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Decode keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: Build release AAB
        run: cd android && ./gradlew bundleRelease
        env:
          ENVFILE: .env.production

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: android/app/build/outputs/bundle/release/*.aab

  ios:
    name: iOS build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Pods
        run: cd ios && bundle exec pod install

      - name: Build iOS
        run: |
          cd ios
          xcodebuild -workspace Vemtap.xcworkspace -scheme Vemtap -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO
